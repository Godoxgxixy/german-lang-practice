<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Немецкие слова — тренажёр</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6a66;--ac:#c8102e;--ok:#1f8a4c;--bad:#c0392b;--bd:#ddd9d0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#222221;--tx:#f0efea;--mut:#a09f99;--ac:#ff5a6e;--ok:#4cc27f;--bad:#ff7a6b;--bd:#3a3935}}
:root[data-theme="dark"]{--bg:#171716;--card:#222221;--tx:#f0efea;--mut:#a09f99;--ac:#ff5a6e;--ok:#4cc27f;--bad:#ff7a6b;--bd:#3a3935}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;cursor:pointer}
button:active{transform:scale(.97)}
.tabs button{flex:1}
.tabs .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;min-height:200px;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:28px;font-weight:600;cursor:pointer;margin:12px 0;user-select:none}
.card.back{color:var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid button{padding:14px}
.opt{width:100%;text-align:left;margin:6px 0;padding:14px}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.q{font-size:26px;font-weight:600;text-align:center;margin:20px 0}
input[type=text]{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.msg{min-height:26px;margin:8px 0;font-weight:600}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}
.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
label{font-size:14px}
</style>
</head>
<body>
<div class="wrap">
<h1>🇩🇪 Немецкие слова</h1>
<div class="tabs" id="tabs"></div>
<div class="bar"><i id="pb"></i></div>
<div class="mut" id="pt"></div>
<div id="app"></div>
</div>
<script>
const RAW=`ich|я
du|ты
Sie|Вы (вежливо)
er|он
sie|она
wer|кто
wie|как
was|что
woher|откуда
wo|где
Wie geht’s?|Как дела?
Wie geht’s dir?|Как ты? / Как у тебя дела?
Wie geht’s Ihnen?|Как Вы? / Как у Вас дела?
Wie heißt du?|Как тебя зовут?
Wie heißen Sie?|Как Вас зовут?
Wer bist du?|Кто ты?
Wer sind Sie?|Кто Вы?
mein|мой
dein|твой
der Name|имя
Vorname|имя
Familienname|фамилия
aus|из
Deutsch|немецкий язык
Musik|музыка
Land|страна
Türkei|Турция
Spanien|Испания
Frankreich|Франция
Österreich|Австрия
USA|США
Deutschland|Германия
Eritrea|Эритрея
Schweiz|Швейцария
Portugal|Португалия
Hallo|Привет / Здравствуйте
Guten Morgen|Доброе утро
Guten Tag|Добрый день
Guten Abend|Добрый вечер
Gute Nacht|Спокойной ночи
Tschüs|Пока
Auf Wiedersehen|До свидания
der Abend|вечер
der Morgen|утро
der Tag|день
die Nacht|ночь
gut|хорошо / хороший
sehr gut|очень хорошо
super|отлично / супер
es geht|нормально / более-менее
nicht so gut|не очень хорошо
auch|тоже
danke|спасибо
Entschuldigung|извините / простите
Wie bitte?|Что, простите? / Как, пожалуйста?
und|и
das ist|это
Wer ist das?|Кто это?
Gespräch|разговор
Frage / Fragen|вопрос / вопросы
Antwort|ответ
Aussage|высказывание / утверждение
Bild / Bilder|картинка / картинки
Bildlexikon|иллюстрированный словарь
Alphabet|алфавит
Buch|книга
Person / Personen|человек / люди
ergänzen|дополнять
sprechen|говорить
fragen|спрашивать
machen|делать
arbeiten|работать
zu zweit|вдвоём / по двое
noch|ещё
markieren|отмечать / выделять
Verb|глагол
Verben|глаголы
zuordnen|сопоставлять
ankreuzen|ставить крестик / отмечать галочкой
hören|слушать / слышать
weiterüben|продолжать упражняться
du oder Sie?|ты или Вы?
Herr|господин
Frau|госпожа / женщина
Was passt zusammen?|Что подходит друг к другу?
verbinden|соединять / связывать
Wer sagt was?|Кто что говорит?
noch einmal|ещё раз
sein|быть
kommen|приходить / прибывать
lernen|учить / изучать
heißen|называться / иметь имя`;
const W=RAW.split('\n').map((l,i)=>{const [d,r]=l.split('|');return{id:i,d,r}});
let known=new Set();
try{known=new Set(JSON.parse(localStorage.getItem('de-known')||'[]'))}catch(e){}
const save=()=>{try{localStorage.setItem('de-known',JSON.stringify([...known]))}catch(e){}};
let mode='cards',dir='de',onlyNew=false,deck=[],pos=0,flip=false,score=0,total=0,answered=false;
const $=s=>document.querySelector(s);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const say=t=>{try{const u=new SpeechSynthesisUtterance(t.replace(/ \/ .*/,''));u.lang='de-DE';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
const norm=s=>s.toLowerCase().replace(/ß/g,'ss').replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim();
const noArt=s=>s.replace(/^(der|die|das) /,'');
function build(){let base=onlyNew?W.filter(w=>!known.has(w.id)):W;if(!base.length){base=W;onlyNew=false}deck=shuffle(base);pos=0;flip=false;score=0;total=0;answered=false}
function progress(){const k=known.size;$('#pb').style.width=(k/W.length*100)+'%';$('#pt').textContent=`Выучено: ${k} из ${W.length}`}
function tabs(){const t=[['cards','Карточки'],['quiz','Тест'],['type','Письмо']];$('#tabs').innerHTML=t.map(([m,n])=>`<button class="${mode===m?'on':''}" onclick="setMode('${m}')">${n}</button>`).join('')}
function setMode(m){mode=m;build();render()}
function opts(){return `<div class="row"><button onclick="dir=dir=='de'?'ru':'de';build();render()">${dir=='de'?'DE → RU':'RU → DE'} ⇄</button><label><input type="checkbox" ${onlyNew?'checked':''} onchange="onlyNew=this.checked;build();render()"> только невыученные</label><button onclick="if(confirm('Сбросить прогресс?')){known.clear();save();build();render()}">Сброс</button></div>`}
function render(){tabs();progress();const w=deck[pos];
if(!w){$('#app').innerHTML=`${opts()}<div class="card" style="cursor:default">Готово! 🎉${mode!='cards'?'<br>Результат: '+score+' / '+total:''}</div><button class="pri" onclick="build();render()">Ещё раз</button>`;return}
const q=dir=='de'?w.d:w.r,a=dir=='de'?w.r:w.d;
if(mode=='cards'){
$('#app').innerHTML=`${opts()}<div class="mut">Карточка ${pos+1} / ${deck.length} — нажмите, чтобы перевернуть</div><div class="card ${flip?'back':''}" onclick="flip=!flip;if(flip&&dir=='ru')say('${a.replace(/'/g,"\\'")}');render()">${flip?a:q}</div><div class="row"><button onclick="say('${w.d.replace(/'/g,"\\'")}')">🔊 Произнести</button>${known.has(w.id)?'<span class="mut">✓ выучено</span>':''}</div><div class="grid"><button onclick="mark(false)">✗ Ещё учу</button><button class="pri" onclick="mark(true)">✓ Знаю</button></div><div class="row"><button onclick="pos=Math.max(0,pos-1);flip=false;render()">← Назад</button><button onclick="pos++;flip=false;render()">Вперёд →</button></div>`;
if(!flip&&dir=='de'&&false)say(w.d)}
else if(mode=='quiz'){
const wrong=shuffle(W.filter(x=>(dir=='de'?x.r:x.d)!==a)).slice(0,3);const o=shuffle([w,...wrong]);
$('#app').innerHTML=`${opts()}<div class="mut">Вопрос ${pos+1} / ${deck.length} · Счёт: ${score}</div><div class="q">${q}</div>${dir=='de'?'<div class="row" style="justify-content:center"><button onclick="say(\''+w.d.replace(/'/g,"\\'")+'\')">🔊</button></div>':''}<div id="o">${o.map(x=>{const t=dir=='de'?x.r:x.d;return `<button class="opt" data-t="${t.replace(/"/g,'&quot;')}">${t}</button>`}).join('')}</div><div class="msg" id="m"></div><button class="pri" id="nx" style="display:none" onclick="pos++;render()">Дальше →</button>`;
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;total++;const ok=b.dataset.t===a;document.querySelectorAll('.opt').forEach(x=>{if(x.dataset.t===a)x.classList.add('ok')});if(ok){score++;known.add(w.id)}else{b.classList.add('bad');known.delete(w.id)}save();progress();$('#nx').style.display='block'});
answered=false}
else{
$('#app').innerHTML=`${opts()}<div class="mut">Слово ${pos+1} / ${deck.length} · Счёт: ${score}</div><div class="q">${q}</div><input type="text" id="in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${dir=='de'?'Переведите на русский':'Напишите по-немецки'}"><div class="msg" id="m"></div><div class="row"><button class="pri" id="ck">Проверить</button><button id="sk">Не знаю</button></div>`;
const inp=$('#in');inp.focus();let done=false;
const fin=ok=>{done=true;total++;if(ok){score++;known.add(w.id);$('#m').innerHTML=`<span class="ok-t">✓ Верно: ${a}</span>`}else{known.delete(w.id);$('#m').innerHTML=`<span class="bad-t">Ответ: ${a}</span>`}save();progress();if(dir=='ru')say(w.d);$('#ck').textContent='Дальше →'};
const check=()=>{if(done){pos++;render();return}const v=inp.value;if(!v.trim())return;let ok;
if(dir=='de'){const n=norm(v),t=norm(a.split('/')[0]);ok=norm(w.d).split('/').map(s=>noArt(norm(s))).includes(noArt(n))||norm(w.d)===n}
else{const n=norm(v);ok=a.split('/').some(s=>{const x=norm(s);return x===n||noArt(x)===noArt(n)})||norm(a)===n}
fin(ok)};
$('#ck').onclick=check;$('#sk').onclick=()=>{if(!done)fin(false)};inp.onkeydown=e=>{if(e.key==='Enter')check()}}
}
function mark(k){const w=deck[pos];if(k)known.add(w.id);else known.delete(w.id);save();pos++;flip=false;render()}
build();render();
</script>
</body>
</html>
